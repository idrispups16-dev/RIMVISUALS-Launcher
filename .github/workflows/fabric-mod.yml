name: Fabric mod 1.21.11
on:
  push:
    paths: ['mod/**', '.github/workflows/fabric-mod.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle -p mod build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RIMVISUALS-Fabric-1.21.11
          path: mod/build/libs/rimvisuals-0.2.0.jar
          if-no-files-found: error
