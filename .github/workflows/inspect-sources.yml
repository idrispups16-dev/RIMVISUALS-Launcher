name: Inspect Minecraft sources (dev)
on:
  push:
    branches: [feature/visuals-claude]
    paths: ['tools/inspect-patterns.txt']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle -p mod genSources --stacktrace
      - name: Collect requested classes
        run: |
          PATTERNS=$(cat tools/inspect-patterns.txt)
          mkdir -p out
          jar=$(find ~/.gradle -name '*minecraft*sources*.jar' -o -name 'minecraft-merged*sources*.jar' | head -1)
          echo "sources jar: $jar"
          mkdir -p src && cd src && unzip -q "$jar" && cd ..
          for p in $PATTERNS; do
            for f in $(find src -name "$p"); do cp "$f" "out/$(echo "$f" | sed 's#^src/##; s#/#.#g')"; done
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mc-sources
          path: out/*
