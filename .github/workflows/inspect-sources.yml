name: Inspect Minecraft sources (dev)
on:
  push:
    branches: [feature/visuals-claude]
    paths: ['tools/inspect-patterns.txt']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle -p mod genSources --stacktrace
      - name: Collect requested classes
        run: |
          PATTERNS=$(cat tools/inspect-patterns.txt)
          mkdir -p out src
          { echo "patterns: $PATTERNS"; find / -name '*sources*.jar' -not -path '*/proc/*' 2>/dev/null | grep -i -E 'minecraft|loom' | head -20; } > out/_debug.txt
          jar=$(grep -E 'sources.*\.jar$' out/_debug.txt | grep -i minecraft | head -1)
          echo "jar=$jar" >> out/_debug.txt
          if [ -n "$jar" ]; then
            (cd src && unzip -q -o "$jar") || true
            for p in $PATTERNS; do
              find src -name "$p" | while read f; do cp "$f" "out/$(echo "$f" | sed 's#^src/##; s#/#.#g')"; done
            done
          fi
          ls -la out >> out/_debug.txt
      - name: Publish extracted sources to a side branch
        if: always()
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cp out/* /tmp/pub/ || true
          cd /tmp/pub
          git init -q && git checkout -q -b claude-inspect-output
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "inspect output for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" claude-inspect-output
