name: RIMVISUALS Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main, 'rebuild/**', 'feature/launcher-gpt', 'feature/accounts-and-profiles', 'feature/local-demo-launch', 'feature/version-and-mod-manager', 'security/installer-audit', 'integration/launcher-visuals']
    paths-ignore: ['mod/**', '.github/workflows/fabric-mod.yml']
permissions:
  contents: read
jobs:
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.2.1'
      - name: Build and test the authoritative Fabric JAR
        run: gradle -p mod build --stacktrace
      - name: Verify client startup and configuration compatibility
        run: |
          set -o pipefail
          timeout 240s xvfb-run -a gradle -p mod runClient -PrimSmoke --stacktrace 2>&1 | tee smoke.log
          grep -q 'RIMVISUALS_SMOKE_OK' smoke.log
          grep -q 'RIM_CONFIG_OK' smoke.log
      - name: Record tested JAR digest
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          jars=list(Path('mod/build/libs').glob('rimvisuals-*.jar'))
          assert len(jars)==1
          jars[0].with_suffix('.jar.sha256').write_text(hashlib.sha256(jars[0].read_bytes()).hexdigest())
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: RIMVISUALS-Tested-Fabric
          path: mod/build/libs/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: RIMVISUALS-Integration-Test-Logs
          path: |
            smoke.log
            mod/build/test-results/test/*.xml
            mod/run/logs/latest.log
            mod/run/screenshots/*.png
  windows:
    needs: fabric
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: RIMVISUALS-Tested-Fabric
          path: mod/build/libs
      - name: Prepare verified bundled JARs
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,urllib.request,shutil,zipfile
          bundle=Path('bundled');bundle.mkdir(exist_ok=True)
          jars=list(Path('mod/build/libs').glob('rimvisuals-*.jar'))
          assert len(jars)==1
          assert hashlib.sha256(jars[0].read_bytes()).hexdigest()==jars[0].with_suffix('.jar.sha256').read_text().strip()
          shutil.copy2(jars[0],bundle/jars[0].name)
          name='fabric-api-0.141.6+1.21.11.jar'
          url='https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.141.6+1.21.11/'+name
          data=urllib.request.urlopen(url).read()
          expected=urllib.request.urlopen(url+'.sha256').read().decode().strip().split()[0]
          assert hashlib.sha256(data).hexdigest()==expected
          (bundle/name).write_bytes(data)
          files=[]
          for p in bundle.glob('*.jar'):
            with zipfile.ZipFile(p) as z:
              meta=json.loads(z.read('fabric.mod.json'))
              if meta['id']=='rimvisuals':
                for cls in ['CrystalFade','HitParticles','PearlTrails','ProjectileTrails','SwordTrails','ArmorHud','TargetHud']:
                  assert 'xyz/rimvisuals/modules/'+cls+'.class' in z.namelist()
            files.append({'name':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'id':meta['id'],'version':meta['version']})
          (bundle/'manifest.json').write_text(json.dumps({'schemaVersion':2,'minecraftVersion':'1.21.11','fabricLoaderVersion':'0.19.3','javaMajor':21,'launcherConfigSchema':1,'files':files}))
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Audit locked dependency tree (do not suppress moderate findings)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force security-output | Out-Null
          npm audit --json | Out-File security-output/npm-audit.json -Encoding utf8
          npm audit --omit=dev --json | Out-File security-output/npm-audit-production.json -Encoding utf8
          node scripts/security/audit-policy.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Dependency policy failed' }
          npm sbom --sbom-format cyclonedx | Out-File security-output/sbom.cyclonedx.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'SBOM creation failed' }
          exit 0
      - name: Record npm registry signature verification separately from vulnerability audit
        continue-on-error: true
        shell: pwsh
        run: npm audit signatures --json | Out-File security-output/npm-registry-signatures.json -Encoding utf8
      - name: Enable actual Defender protection only in disposable GitHub-hosted CI
        shell: pwsh
        run: ./scripts/security/enable-ci-defender.ps1
      - name: Download exact blocked installer for audit (never execute it)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: RIMVISUALS-Windows-Installer
          run-id: 41248974550
          github-token: ${{ github.token }}
          path: original-installer
      - name: Scan original installer and record Authenticode/Defender evidence
        continue-on-error: true
        shell: pwsh
        run: ./scripts/security/scan-windows.ps1 -Target original-installer -Report security-output/original-defender.json
      - name: Inspect original application sources without running them
        shell: pwsh
        run: |
          $scan = Get-Content security-output/original-defender.json -Raw | ConvertFrom-Json
          if ($scan.status -eq 'no-detection') { node scripts/security/package-evidence.mjs --original }
          else { Write-Output 'Original inspection withheld: no completed clean Defender scan' }

      - name: Scan original extracted application and expanded ASAR sources
        continue-on-error: true
        shell: pwsh
        run: ./scripts/security/scan-windows.ps1 -Target original-application -Report security-output/original-unpacked-defender.json
      - name: Test launcher discovery
        run: node --test tests/*.cjs
      - name: Verify automatic Java download and reuse
        run: node tests/java-runtime-smoke.js
      - name: Verify native Windows token encryption
        run: npx --no-install electron tests/electron-storage-smoke.js
      - name: Verify actual bundled component installation
        run: node tests/components-smoke.js
      - name: Verify isolated Minecraft installation
        run: node tests/install-smoke.js
      - name: Validate application
        run: npm run check
      - name: Verify account and profile UI through real Electron IPC
        run: node tests/ui/electron-smoke.cjs
      - name: Build Windows installer
        run: npm run dist:win
      - name: Verify packaged components
        shell: python
        run: |
          from pathlib import Path
          import json,hashlib,zipfile
          resource=Path('release/win-unpacked/resources')
          assert (resource/'app.asar').is_file()
          bundle=resource/'bundled'
          files=json.loads((bundle/'manifest.json').read_text())['files']
          assert len(files)==2
          ids=set()
          for entry in files:
            p=bundle/entry['name']
            assert hashlib.sha256(p.read_bytes()).hexdigest()==entry['sha256']
            with zipfile.ZipFile(p) as z:
              mod=json.loads(z.read('fabric.mod.json'));ids.add(mod['id'])
              assert '1.21.11' in mod['depends']['minecraft']
          assert ids=={'rimvisuals','fabric-api'}
          print('RIM_PACKAGE_OK: engine and Fabric API are embedded and verified')
      - name: Verify EXE output
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release -Filter 'RIMVISUALS-Setup-*.exe' -File)
          if ($files.Count -ne 1) { throw "Expected one installer, found $($files.Count)" }
          if ($files[0].Length -lt 1000000) { throw 'Installer unexpectedly small' }
          Get-FileHash $files[0].FullName -Algorithm SHA256 | Format-List
      - name: Compare packaged sources to the exact build commit
        run: node scripts/security/package-evidence.mjs
      - name: Scan new installer and unpacked executable tree
        shell: pwsh
        run: ./scripts/security/scan-windows.ps1 -Target release -Report security-output/new-defender.json
      - name: Verify silent installer in isolated Windows directory
        shell: pwsh
        run: |
          $new = Get-Content security-output/new-defender.json -Raw | ConvertFrom-Json
          if ($new.status -ne 'no-detection') { throw 'No completed clean scan of new build' }
          $installer = Get-ChildItem release -Filter 'RIMVISUALS-Setup-*.exe' -File | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'rimvisuals-installed-smoke'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          foreach ($relative in @('RIMVISUALS Launcher.exe', 'resources/app.asar', 'resources/bundled/manifest.json')) {
            $installed = Join-Path $installDir $relative
            $source = Join-Path 'release/win-unpacked' $relative
            if (!(Test-Path -LiteralPath $installed)) { throw "Installed file missing: $relative" }
            if ((Get-FileHash -LiteralPath $installed).Hash -ne (Get-FileHash -LiteralPath $source).Hash) { throw "Installed file mismatch: $relative" }
          }
          $manifest = Get-Content -LiteralPath (Join-Path $installDir 'resources/bundled/manifest.json') -Raw | ConvertFrom-Json
          foreach ($entry in $manifest.files) {
            $jar = Join-Path $installDir "resources/bundled/$($entry.name)"
            if ((Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.sha256) { throw 'Installed JAR integrity mismatch' }
          }
          $app = Start-Process -FilePath (Join-Path $installDir 'RIMVISUALS Launcher.exe') -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 80; $i++) {
              Start-Sleep -Milliseconds 250
              $app.Refresh()
              if ($app.HasExited) { throw 'Installed application exited before showing its window' }
              if ($app.MainWindowTitle -eq 'RIMVISUALS Launcher') { $ready = $true; break }
            }
            if (!$ready) { throw 'Installed application window did not become ready' }
            Start-Sleep -Seconds 3
            $app.Refresh()
            if ($app.HasExited) { throw 'Installed application crashed after showing its window' }
            Write-Output 'RIM_PACKAGED_START_OK: installed application opens its real window with security fuses enabled; no game world claimed'
          } finally { if (!$app.HasExited) { Stop-Process -Id $app.Id -Force } }
          Write-Output 'RIM_INSTALLER_OK: silent NSIS install, executable, app.asar and embedded JAR hashes verified in isolated CI directory'
      - name: Require completed security evidence before publishing installer
        shell: pwsh
        run: |
          foreach ($kind in @('original','original-unpacked','new')) {
            $scan = Get-Content "security-output/$kind-defender.json" -Raw | ConvertFrom-Json
            if ($scan.status -ne 'no-detection') { throw "Security review incomplete: $kind $($scan.status)" }
          }
          if (!(Test-Path security-output/original-package-evidence.json)) { throw 'Original source comparison incomplete' }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: RIMVISUALS-Windows-Installer
          path: release/RIMVISUALS-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: RIMVISUALS-Component-Manifest
          path: bundled/manifest.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: RIMVISUALS-Launcher-UI
          path: test-output/*
          if-no-files-found: ignore

      - name: Publish security evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: RIMVISUALS-Security-Evidence
          path: |
            security-output/*
            docs/security/*
          if-no-files-found: error
          retention-days: 30
