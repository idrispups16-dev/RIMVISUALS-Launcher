name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project root
        shell: bash
        run: |
          set -euo pipefail
          SRC="."
          ZIPS=$(find . -maxdepth 1 -type f -name '*.zip' | sort)
          if [ -n "$ZIPS" ]; then
            COUNT=$(echo "$ZIPS" | wc -l)
            if [ "$COUNT" -gt 1 ]; then
              echo "::warning::Several zip files in the repository root, using the first one"
            fi
            ZIP=$(echo "$ZIPS" | head -n1)
            echo "Unpacking $ZIP"
            rm -rf _unpacked
            mkdir _unpacked
            unzip -q "$ZIP" -d _unpacked
            SRC="_unpacked"
          fi
          FILE=$(find "$SRC" -maxdepth 6 -type f -name build.gradle -not -path '*/.git/*' | awk '{ print length($0) "\t" $0 }' | sort -n | head -n1 | cut -f2-)
          if [ -z "$FILE" ]; then
            echo "::error::build.gradle not found"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project root: $DIR"
          echo "DIR=$DIR" >> "$GITHUB_ENV"
          if [ -f "$DIR/REVISION.txt" ]; then cat "$DIR/REVISION.txt"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build
        shell: bash
        run: gradle build -p "$DIR" --no-daemon --stacktrace

      - name: Check build output
        shell: bash
        run: |
          set -euo pipefail
          ls -la "$DIR/build/libs"
          test -f "$DIR/build/libs/rimvisuals-0.2.0.jar"
          N=$(find "$DIR/build/libs" -maxdepth 1 -name '*.jar' | wc -l)
          if [ "$N" -ne 1 ]; then
            echo "::error::Expected exactly one jar in build/libs, found $N"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rimvisuals-0.2.0
          path: ${{ env.DIR }}/build/libs/rimvisuals-0.2.0.jar
          if-no-files-found: error
